<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f1ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>{% block title %}ごまモニター{% endblock %}</title>
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base }}/static/favicon-32.png">
  <link rel="shortcut icon" href="{{ base }}/static/favicon.ico">
  <style>
    /* ══════════════════════════════════════════════════════════════════
       ごまモニター v3
       外部フォントは読まない。iPhone では -apple-system が SF Pro を、
       Hiragino Sans が和文を出す。これが「Appleのサイトの字」そのもので、
       webfont を足すとむしろ遠ざかる（かつ 1 リクエスト減る）。
       ══════════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light dark;

      --bg:         #f2f1ef;
      --surface:    #ffffff;
      --surface-2:  #f7f6f4;
      --ink:        #17140f;
      --ink-2:      #6b6660;
      --ink-3:      #a29c95;
      --hairline:   rgba(23,20,15,0.10);
      --hairline-2: rgba(23,20,15,0.055);
      --accent:     #b25f22;
      --nav-bg:     rgba(242,241,239,0.72);
      --scrim:      rgba(0,0,0,0.55);
      --elev:       0 1px 2px rgba(23,20,15,0.05), 0 10px 30px rgba(23,20,15,0.055);

      /* 行動色（本番から据え置き。30日分の見慣れた対応を壊さないため） */
      --c-sleeping: #4a5595;
      --c-active:   #2d9a88;
      --c-walking:  #4caa6a;
      --c-playing:  #e07828;
      --c-drinking: #3a9fd4;
      --c-sitting:  #7a8ca0;
      --c-absent:   #b0b8c4;
      --c-unknown:  #c0a898;
      --c-unrecorded: #ddd9d4;

      /* 室温4色（light: validator 5/5 PASS） */
      --t-cold: #2f6fb0;
      --t-ok:   #2b9873;
      --t-warn: #c67610;
      --t-crit: #a82815;
      --c-hum:  #3a9fd4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #000000;
        --surface:    #1c1c1e;
        --surface-2:  #2c2c2e;
        --ink:        #f5f5f7;
        --ink-2:      #9b968f;
        --ink-3:      #6e6a65;
        --hairline:   rgba(255,255,255,0.13);
        --hairline-2: rgba(255,255,255,0.07);
        --accent:     #ff9d4d;
        --nav-bg:     rgba(0,0,0,0.7);
        --scrim:      rgba(0,0,0,0.5);
        --elev:       none;

        --c-sleeping: #6c78bd;
        --c-active:   #35b5a1;
        --c-walking:  #5cb87c;
        --c-playing:  #f08a3c;
        --c-drinking: #4bb0e0;
        --c-sitting:  #8d9db0;
        --c-absent:   #7e848e;
        --c-unknown:  #b09a88;
        --c-unrecorded: #3a3a3c;

        /* dark: validator PASS ×4 / WARN ×1（注意↔危険 ΔE 6.1、数値併記で補う） */
        --t-cold: #3f8ad4;
        --t-ok:   #2ba883;
        --t-warn: #ad8c10;
        --t-crit: #d63f2e;
        --c-hum:  #4bb0e0;
      }
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro JP",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 17px;
      line-height: 1.6;
      letter-spacing: 0.01em;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      /* ダブルタップ拡大の抑止。ピンチは下部の JS 側で止める */
      touch-action: manipulation;
    }
    #lb { touch-action: auto; }   /* 写真の拡大表示中だけ拡大を許す */

    /* ── ナビ ────────────────────────────────────
       半透明＋背後をぼかす。Apple の nav の要はこの一枚と
       下端のヘアラインだけで、影も枠も置かないこと。 */
    .nav {
      position: sticky; top: 0; z-index: 300;
      background: var(--nav-bg);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--hairline);
    }
    .nav-inner {
      max-width: 640px; margin: 0 auto;
      padding: 0.7rem 20px;
      display: flex; align-items: center; gap: 0.75rem;
      min-height: 44px;   /* iOS のタップ最小寸法 */
    }
    .nav-title {
      font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em;
      color: var(--ink); text-decoration: none;
    }
    .nav-title:hover { text-decoration: none; }
    .nav-aside {
      margin-left: auto;
      font-size: 0.8125rem; color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 0.15rem;
      font-size: 1.0625rem; color: var(--accent); text-decoration: none;
      letter-spacing: -0.01em;
    }
    .nav-back:hover { text-decoration: none; opacity: 0.65; }
    .nav-back::before { content: "‹"; font-size: 1.5rem; line-height: 1; margin-top: -2px; }

    /* ── レイアウト ─────────────────────────────── */
    .page { max-width: 640px; margin: 0 auto; padding: 1.5rem 20px 4rem; }
    .sec { margin-top: 2.75rem; }
    .sec:first-child { margin-top: 0; }

    .sec-head {
      display: flex; align-items: baseline; gap: 0.6rem;
      margin-bottom: 0.85rem;
    }
    .sec-head h2 {
      font-size: 1.375rem; font-weight: 600; letter-spacing: -0.021em;
      line-height: 1.3;
    }
    .sec-head .aside {
      margin-left: auto; font-size: 0.8125rem; color: var(--ink-3);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    /* 小見出し。和文なので大文字化はせず、字間だけ開ける */
    .cap {
      font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.05em;
      color: var(--ink-2);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--elev);
      overflow: hidden;
    }

    /* 端末幅いっぱいに写真を出す。640px を超えたら角丸へ戻す */
    .bleed { margin-left: -20px; margin-right: -20px; }
    @media (min-width: 680px) { .bleed { margin-left: 0; margin-right: 0; } }

    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    /* 行動の識別。塗りつぶしピルをやめ、点＋文字にする。
       文字が常に添うので、色だけに頼らない（8色の CVD 余裕が薄いため） */
    .tag { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: block; }
    .dot.sleeping { background: var(--c-sleeping); }
    .dot.active   { background: var(--c-active); }
    .dot.walking  { background: var(--c-walking); }
    .dot.playing  { background: var(--c-playing); }
    .dot.drinking { background: var(--c-drinking); }
    .dot.sitting  { background: var(--c-sitting); }
    .dot.absent   { background: var(--c-absent); }
    .dot.unknown  { background: var(--c-unknown); }
    .dot.unrecorded { background: var(--c-unrecorded); }

    /* ── ボタン ────────────────────────────────── */
    .btn {
      font: inherit; font-size: 0.9375rem; font-weight: 500;
      padding: 0.44rem 1.05rem; border-radius: 980px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      transition: opacity 0.15s; white-space: nowrap;
      -webkit-appearance: none;
    }
    .btn:hover:not(:disabled) { opacity: 0.82; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-quiet {
      background: transparent; color: var(--accent);
      padding: 0.3rem 0.55rem; font-size: 0.8125rem;
    }
    .btn-quiet:hover:not(:disabled) { background: var(--surface-2); opacity: 1; }
    .btn-grey {
      background: var(--surface-2); color: var(--ink-2);
    }

    .empty {
      text-align: center; color: var(--ink-3);
      padding: 4rem 1rem; font-size: 0.9375rem;
    }

    /* ══ 室温 ═══════════════════════════════════════ */
    /* 主役の数値。Apple の製品ページの「数字が語る」レイアウト */
    .readout { display: flex; align-items: flex-end; gap: 0.7rem; flex-wrap: wrap; }
    .readout .big {
      font-size: 3.5rem; font-weight: 600; line-height: 0.95;
      letter-spacing: -0.035em; font-variant-numeric: tabular-nums;
    }
    .readout .unit { font-size: 1.6rem; font-weight: 400; color: var(--ink-3); letter-spacing: -0.02em; }
    .readout .side {
      font-size: 0.9375rem; color: var(--ink-2); padding-bottom: 0.3rem;
      font-variant-numeric: tabular-nums;
    }
    .readout.cold .big { color: var(--t-cold); }
    .readout.ok   .big { color: var(--ink); }
    .readout.warn .big { color: var(--t-warn); }
    .readout.crit .big { color: var(--t-crit); }
    .readout.stale .big { color: var(--ink-3); font-size: 2rem; letter-spacing: -0.02em; }

    .t-state {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.8125rem; font-weight: 600;
    }
    .t-state i { width: 7px; height: 7px; border-radius: 50%; flex: none; display: block; }
    .t-state.cold { color: var(--t-cold); } .t-state.cold i { background: var(--t-cold); }
    .t-state.ok   { color: var(--t-ok); }   .t-state.ok   i { background: var(--t-ok); }
    .t-state.warn { color: var(--t-warn); } .t-state.warn i { background: var(--t-warn); }
    .t-state.crit { color: var(--t-crit); } .t-state.crit i { background: var(--t-crit); }
    .t-state.stale{ color: var(--ink-3); }  .t-state.stale i { background: var(--ink-3); }

    /* 写真オーバーレイの室温。平常時は主張させない */
    .ov-temp {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.8125rem; font-weight: 600; color: #fff;
      padding: 0.2rem 0.6rem; border-radius: 980px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
      background: rgba(255,255,255,0.2);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .ov-temp.warn  { background: rgba(198,118,16,0.9); }
    .ov-temp.crit  { background: rgba(168,40,21,0.92); }
    .ov-temp.stale { color: rgba(255,255,255,0.55); }

    .stale-note {
      font-size: 0.875rem; line-height: 1.55; color: var(--ink-2);
      background: var(--surface-2); border-radius: 12px;
      padding: 0.7rem 0.85rem; margin-bottom: 0.85rem;
    }
    .stale-note b { color: var(--ink); font-weight: 600; }

    /* ── グラフ共通 ─────────────────────────────── */
    /* 罫線は極力引かない。目盛りは 2〜3 本、軸の箱は描かない */
    .chart-wrap { position: relative; overflow-x: clip; }
    .chart-svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .grid-line   { stroke: var(--hairline-2); stroke-width: 1; }
    .axis-text   { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
    .thresh-line { stroke: var(--t-crit); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.5; }
    .thresh-text { fill: var(--t-crit); font-size: 9.5px; font-weight: 600; }
    .band-crit   { fill: var(--t-crit); opacity: 0.06; }
    .series-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .series-line.temp { stroke: var(--t-crit); }
    .series-line.hum  { stroke: var(--c-hum); }
    .series-line.cool { stroke: var(--t-ok); }
    .series-line.hot  { stroke: var(--t-crit); }
    .end-dot { stroke: var(--surface); stroke-width: 2; }
    .end-dot.temp { fill: var(--t-crit); }
    .end-dot.hum  { fill: var(--c-hum); }
    .end-dot.cool { fill: var(--t-ok); }
    .end-dot.hot  { fill: var(--t-crit); }
    /* opacity をここに書いてはいけない。CSS は presentation attribute に勝つので
       JS の setAttribute("opacity","0") が無効化され、初期位置 x=0（左端）に
       縦線が出たままになる。表示・非表示は JS 側の属性だけで制御する。 */
    .cross-line { stroke: var(--ink); stroke-width: 1; }
    /* グラデーションの停止色は CSS プロパティなので変数がそのまま効く＝ダーク追従 */
    .grad-temp stop:first-child { stop-color: var(--t-crit); stop-opacity: 0.18; }
    .grad-temp stop:last-child  { stop-color: var(--t-crit); stop-opacity: 0; }
    .grad-hum  stop:first-child { stop-color: var(--c-hum);  stop-opacity: 0.18; }
    .grad-hum  stop:last-child  { stop-color: var(--c-hum);  stop-opacity: 0; }
    .chart-tip {
      position: absolute; pointer-events: none;
      background: var(--ink); color: var(--surface);
      font-size: 0.75rem; font-weight: 600; padding: 0.22rem 0.55rem;
      border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums;
      opacity: 0; transition: opacity 0.12s; transform: translate(-50%, -135%); z-index: 5;
    }

    /* スパークラインは viewBox 幅240を約344pxへ拡大表示するため、日別詳細のグラフ
       （340→ほぼ等倍）と同じ stroke-width でも約1.4倍太く描かれる。
       non-scaling-stroke で線幅を画面実寸に固定する。 */
    .spark { display: block; width: 100%; height: auto; }
    .spark .series-line, .spark .thresh-line, .spark circle { vector-effect: non-scaling-stroke; }
    .spark .series-line { stroke-width: 1.5; }
    .spark circle { stroke-width: 1.2; }

    /* ── プレビューバー ─────────────────────────── */
    .pv {
      background: var(--surface);
      border-bottom: 0.5px solid var(--hairline);
      font-size: 0.75rem; color: var(--ink-3);
    }
    .pv-inner {
      max-width: 640px; margin: 0 auto; padding: 0.4rem 20px;
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    }
    .pv-inner .sp { margin-left: auto; display: flex; gap: 0.9rem; }
    .pv a { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">{% block nav %}{% endblock %}</div>
  </nav>
  {% if preview %}
  <div class="pv">
    <div class="pv-inner">
      <span>プレビュー — 室温はダミー値</span>
      <span class="sp">
        {% if sensor_stale %}<a href="?ui=v3">センサーを戻す</a>{% else %}<a href="?ui=v3&amp;sensor=stale">センサー停止</a>{% endif %}
        <a href="?ui=v2">現行UIに戻す</a>
      </span>
    </div>
  </div>
  {% endif %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script>
  /* 室温グラフ。テンプレートが埋めた JSON を読んで SVG を組む。
     線色は CSS クラスで与える（インライン属性にすると
     ダークモードへ切り替わったときに追従しない）。 */
  (function () {
    "use strict";
    var node = document.getElementById("climate-data");
    if (!node) { return; }
    var SERIES = JSON.parse(node.textContent || "[]");
    if (!SERIES.length) { return; }
    var NS = "http://www.w3.org/2000/svg";

    function el(n, a) {
      var e = document.createElementNS(NS, n);
      for (var k in a) { if (a[k] !== null && a[k] !== undefined) { e.setAttribute(k, a[k]); } }
      return e;
    }

    /* ── トップ: 24h行動ストリップと同じ時間軸のスパークライン ── */
    var spark = document.getElementById("spark");
    if (spark) {
      var n = SERIES.length, W = n * 10, H = 40, pT = 5, pB = 3, ih = H - pT - pB;
      spark.setAttribute("viewBox", "0 0 " + W + " " + H);
      var lo = 22, hi = 34;
      var sx = function (i) { return i * 10 + 5; };
      var sy = function (v) { return pT + ih - ((v - lo) / (hi - lo)) * ih; };
      var f = document.createDocumentFragment();
      f.appendChild(el("rect", { x: 0, y: pT, width: W, height: Math.max(0, sy(28) - pT), class: "band-crit" }));
      f.appendChild(el("line", { x1: 0, y1: sy(28), x2: W, y2: sy(28), class: "thresh-line" }));
      var segs = [], cur = null;
      SERIES.forEach(function (c, i) {
        var hot = c.temp >= 28, pt = [sx(i), sy(c.temp)];
        if (!cur) { cur = { hot: hot, pts: [pt] }; }
        else if (cur.hot !== hot) { cur.pts.push(pt); segs.push(cur); cur = { hot: hot, pts: [pt] }; }
        else { cur.pts.push(pt); }
      });
      if (cur) { segs.push(cur); }
      segs.forEach(function (sg) {
        if (sg.pts.length < 2) { return; }
        var d = sg.pts.map(function (p, k) {
          return (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
        }).join(" ");
        f.appendChild(el("path", { d: d, class: "series-line " + (sg.hot ? "hot" : "cool") }));
      });
      var lastC = SERIES[n - 1];
      // r は viewBox 単位なので non-scaling-stroke では細くならない。
      // 表示倍率（約1.43倍）を見込んで小さめに取る。
      f.appendChild(el("circle", {
        cx: sx(n - 1), cy: sy(lastC.temp), r: 1.8,
        class: "end-dot " + (lastC.temp >= 28 ? "hot" : "cool")
      }));
      spark.appendChild(f);
    }

    /* ── 日別詳細: 温度・湿度の2枚（1枚に2軸は立てない） ── */
    function build(id, tipId, vals, lo, hi, ticks, unit, kind, thresh) {
      var svg = document.getElementById(id);
      if (!svg) { return; }
      var tip = document.getElementById(tipId);
      var W = 340, H = thresh ? 124 : 100, pL = 26, pR = 10, pT = 12, pB = 18;
      var iw = W - pL - pR, ih = H - pT - pB, last = vals.length - 1;
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      var X = function (i) { return pL + (iw * i) / last; };
      var Y = function (v) { return pT + ih - ((v - lo) / (hi - lo)) * ih; };
      var f = document.createDocumentFragment();

      if (thresh && thresh < hi) {
        f.appendChild(el("rect", { x: pL, y: pT, width: iw, height: Math.max(0, Y(thresh) - pT), class: "band-crit" }));
        f.appendChild(el("line", { x1: pL, y1: Y(thresh), x2: pL + iw, y2: Y(thresh), class: "thresh-line" }));
        // 右端に置くと折れ線と重なる（右肩上がりの日は必ず衝突する）。
        // 左端へ寄せたうえで、面色の下敷きを敷いて線の上を通っても読めるようにする。
        f.appendChild(el("rect", {
          x: pL + 1, y: Y(thresh) - 11, width: 46, height: 11,
          fill: "var(--surface)", rx: 3
        }));
        var tt = el("text", { x: pL + 4, y: Y(thresh) - 3, class: "thresh-text", "text-anchor": "start" });
        tt.textContent = "危険 " + thresh + "℃";
        f.appendChild(tt);
      }
      ticks.forEach(function (v) {
        f.appendChild(el("line", { x1: pL, y1: Y(v), x2: pL + iw, y2: Y(v), class: "grid-line" }));
        var t = el("text", { x: pL - 6, y: Y(v) + 3.5, class: "axis-text", "text-anchor": "end" });
        t.textContent = v + unit;
        f.appendChild(t);
      });
      // 現在時刻のラベルは必ず出す。定時ラベルはそれと近すぎるなら省く
      // （14時が最新の日に「12時 14時」が重なって潰れた）。
      [0, 6, 12, 18, last].forEach(function (i) {
        if (i > last) { return; }
        if (i !== last && last - i < 3) { return; }
        var t = el("text", {
          x: X(i), y: H - 4, class: "axis-text",
          "text-anchor": i === 0 ? "start" : (i === last ? "end" : "middle")
        });
        t.textContent = (i === 23 ? 24 : i) + "時";
        f.appendChild(t);
      });

      var dLine = "";
      vals.forEach(function (v, i) { dLine += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " "; });
      var gid = id + "-g", defs = el("defs", {});
      var lg = el("linearGradient", { id: gid, class: "grad-" + kind, x1: "0", y1: "0", x2: "0", y2: "1" });
      lg.appendChild(el("stop", { offset: "0%" }));
      lg.appendChild(el("stop", { offset: "100%" }));
      defs.appendChild(lg); f.appendChild(defs);
      f.appendChild(el("path", {
        d: dLine + "L" + X(last).toFixed(1) + " " + (pT + ih) + " L" + pL + " " + (pT + ih) + " Z",
        fill: "url(#" + gid + ")", stroke: "none"
      }));
      f.appendChild(el("path", { d: dLine, class: "series-line " + kind }));
      f.appendChild(el("circle", { cx: X(last), cy: Y(vals[last]), r: 4, class: "end-dot " + kind }));

      var cross = el("line", { x1: 0, y1: pT, x2: 0, y2: pT + ih, class: "cross-line", opacity: "0" });
      var hdot = el("circle", { cx: 0, cy: 0, r: 4.5, class: "end-dot " + kind, opacity: "0" });
      f.appendChild(cross); f.appendChild(hdot);
      var hit = el("rect", { x: pL, y: pT, width: iw, height: ih, fill: "transparent", "pointer-events": "all" });
      f.appendChild(hit);
      svg.appendChild(f);

      function move(ev) {
        var r = svg.getBoundingClientRect();
        var i = Math.round(((((ev.clientX - r.left) / r.width) * W) - pL) / iw * last);
        if (i < 0) { i = 0; }
        if (i > last) { i = last; }
        var cx = X(i), cy = Y(vals[i]);
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", "0.3");
        hdot.setAttribute("cx", cx); hdot.setAttribute("cy", cy); hdot.setAttribute("opacity", "1");
        // 先に文面を入れてから幅を測る（幅が確定しないとクランプできない）
        tip.textContent = SERIES[i].hour + ":00　" + vals[i] + unit;
        tip.style.opacity = "1";
        tip.style.top = (cy / H * 100) + "%";
        // 端で吹き出しがコンテナからはみ出すと、ページ全体が横に広がり
        // iPhone が縮小表示になる。左右をコンテナ内へクランプする。
        var wrapW = (svg.parentElement && svg.parentElement.clientWidth) || svg.clientWidth;
        var half = tip.offsetWidth / 2 + 2;
        var px = (cx / W) * wrapW;
        if (wrapW > tip.offsetWidth + 4) {
          px = Math.max(half, Math.min(wrapW - half, px));
        }
        tip.style.left = px + "px";
      }
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", function () {
        cross.setAttribute("opacity", "0"); hdot.setAttribute("opacity", "0"); tip.style.opacity = "0";
      });
    }

    var temps = SERIES.map(function (c) { return c.temp; });
    var hums = SERIES.map(function (c) { return c.hum; });
    build("chart-temp", "tip-temp", temps, 22, 34, [22, 28, 34], "℃", "temp", 28);
    build("chart-hum", "tip-hum", hums, 40, 90, [40, 65, 90], "%", "hum", null);
  })();
  </script>

  <script>
  /* ページのピンチ／ダブルタップ拡大を禁止する。写真の拡大表示中（#lb 表示中）だけ許可。

     meta viewport の user-scalable=no / maximum-scale は iOS Safari が
     アクセシビリティのため無視するので効かない。Safari 固有の gesture イベントを
     止めるのが実際に効く唯一の方法。 */
  (function () {
    "use strict";
    function lightboxOpen() {
      var lb = document.getElementById("lb");
      return !!lb && getComputedStyle(lb).display !== "none";
    }
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
      document.addEventListener(type, function (e) {
        if (!lightboxOpen()) { e.preventDefault(); }
      }, { passive: false });
    });

    // ダブルタップ拡大。touch-action:manipulation だけでは iOS が取りこぼすので
    // 2回目のタップを直接潰す。誤爆を避けるため「300ms 以内」かつ
    // 「30px 以内の同じ場所」の2条件が揃ったときだけ抑止する。
    var lastEnd = 0, lastX = -999, lastY = -999;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      var t = e.changedTouches && e.changedTouches[0];
      var x = t ? t.clientX : 0;
      var y = t ? t.clientY : 0;
      var samePlace = Math.abs(x - lastX) < 30 && Math.abs(y - lastY) < 30;
      if (now - lastEnd <= 300 && samePlace && !lightboxOpen()) {
        e.preventDefault();
      }
      lastEnd = now; lastX = x; lastY = y;
    }, { passive: false });
  })();
  </script>
</body>
</html>
